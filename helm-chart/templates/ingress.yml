{{ $appName := include "app.name" . }}

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name:  {{ $appName }}
  namespace: {{ index .Values.namespace }}
  labels:
    {{ include "common.labels" . | nindent 4 }}
  annotations:
    kubernetes.io/ingress.class: "nginx"
  nginx.ingress.kubernetes.io/rewrite-target: /api/v1
  
spec:
  ingressClassName: nginx
  rules:
    - host: abed.app
      http: 
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ $appName }}
                port:
                  number: {{ index .Values "document-app" "service" "port" "expose-port" }}
